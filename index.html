
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planetary Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    h1, h2, h3, h4, h5, h6, .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fadeInUp {
      animation: fadeInUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes subtle-scroll {
      0% { transform: translateY(4px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(4px); }
    }
    .animate-subtle-scroll {
        animation: subtle-scroll 2.5s infinite ease-in-out;
    }

    @keyframes background-pan {
      0% { background-position: 0% center; }
      100% { background-position: 100% center; }
    }
    .animate-background-pan {
        animation: background-pan 45s ease-in-out infinite alternate;
        background-size: 120% auto;
    }

    @keyframes grid-scroll {
        from { transform: translateY(0px); }
        to { transform: translateY(-50px); }
    }
    .animated-grid {
        width: 100%;
        height: calc(100% + 50px);
        background-image:
            linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
        background-size: 50px 50px;
        position: absolute;
        top: 0;
        left: 0;
        will-change: transform;
        animation: grid-scroll 10s linear infinite;
    }
  </style>
